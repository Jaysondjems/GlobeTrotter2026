apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: globetrotter
data:
  01-create-databases.sql: |
    CREATE DATABASE globetrotter_users;
    CREATE DATABASE globetrotter_destinations;
    CREATE DATABASE globetrotter_itineraries;
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: globetrotter
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
# A single-replica Deployment is a simplification for this local/course cluster.
# A real deployment would use a StatefulSet (stable storage identity) or a managed
# database service - out of scope for the Phase 1-4 learning objectives.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: globetrotter
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ containerPort: 5432 }]
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: globetrotter-secrets, key: POSTGRES_PASSWORD }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: postgres
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "postgres"] }
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: postgres-pvc }
        - name: init
          configMap: { name: postgres-init }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: globetrotter
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
