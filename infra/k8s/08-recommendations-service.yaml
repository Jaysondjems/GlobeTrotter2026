apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendations-service
  namespace: globetrotter
spec:
  replicas: 2
  selector:
    matchLabels: { app: recommendations-service }
  template:
    metadata:
      labels: { app: recommendations-service }
    spec:
      containers:
        - name: recommendations-service
          image: globetrotter/recommendations-service:latest
          imagePullPolicy: Never
          ports: [{ containerPort: 4004 }]
          env:
            - { name: PORT, value: "4004" }
            - name: NODE_ENV
              valueFrom: { configMapKeyRef: { name: globetrotter-config, key: NODE_ENV } }
            - name: USERS_SERVICE_URL
              valueFrom: { configMapKeyRef: { name: globetrotter-config, key: USERS_SERVICE_URL } }
            - name: DESTINATIONS_SERVICE_URL
              valueFrom: { configMapKeyRef: { name: globetrotter-config, key: DESTINATIONS_SERVICE_URL } }
            - name: ITINERARIES_SERVICE_URL
              valueFrom: { configMapKeyRef: { name: globetrotter-config, key: ITINERARIES_SERVICE_URL } }
            - name: REDIS_URL
              valueFrom: { configMapKeyRef: { name: globetrotter-config, key: REDIS_URL } }
            - name: RABBITMQ_URL
              valueFrom: { configMapKeyRef: { name: globetrotter-config, key: RABBITMQ_URL } }
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "250m", memory: "256Mi" }
          readinessProbe:
            httpGet: { path: /health, port: 4004 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 4004 }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: recommendations-service
  namespace: globetrotter
spec:
  selector: { app: recommendations-service }
  ports: [{ port: 4004, targetPort: 4004 }]
