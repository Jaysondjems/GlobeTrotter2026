apiVersion: apps/v1
kind: Deployment
metadata:
  name: destinations-service
  namespace: globetrotter
spec:
  replicas: 2
  selector:
    matchLabels: { app: destinations-service }
  template:
    metadata:
      labels: { app: destinations-service }
    spec:
      containers:
        - name: destinations-service
          image: globetrotter/destinations-service:latest
          imagePullPolicy: Never
          ports: [{ containerPort: 4002 }]
          env:
            - { name: PORT, value: "4002" }
            - name: NODE_ENV
              valueFrom: { configMapKeyRef: { name: globetrotter-config, key: NODE_ENV } }
            - name: REDIS_URL
              valueFrom: { configMapKeyRef: { name: globetrotter-config, key: REDIS_URL } }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: globetrotter-secrets, key: DATABASE_URL_DESTINATIONS } }
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "250m", memory: "256Mi" }
          readinessProbe:
            httpGet: { path: /health, port: 4002 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 4002 }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: destinations-service
  namespace: globetrotter
spec:
  selector: { app: destinations-service }
  ports: [{ port: 4002, targetPort: 4002 }]
---
# Auto-scaling demo: destinations-service is the highest-read-traffic service (search),
# so it's the natural candidate to show horizontal scaling under load.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: destinations-service-hpa
  namespace: globetrotter
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: destinations-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 50 }
