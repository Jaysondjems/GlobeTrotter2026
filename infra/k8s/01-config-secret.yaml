apiVersion: v1
kind: ConfigMap
metadata:
  name: globetrotter-config
  namespace: globetrotter
data:
  USERS_SERVICE_URL: "http://users-service:4001"
  DESTINATIONS_SERVICE_URL: "http://destinations-service:4002"
  ITINERARIES_SERVICE_URL: "http://itineraries-service:4003"
  RECOMMENDATIONS_SERVICE_URL: "http://recommendations-service:4004"
  REDIS_URL: "redis://redis:6379"
  RABBITMQ_URL: "amqp://rabbitmq:5672"
  NODE_ENV: "production"
---
# Demo-only secret (plain stringData for a local/course cluster). In a real deployment this
# would come from a secret manager (Vault, SOPS, cloud KMS), never committed to git.
apiVersion: v1
kind: Secret
metadata:
  name: globetrotter-secrets
  namespace: globetrotter
type: Opaque
stringData:
  POSTGRES_PASSWORD: "GlobeTrotter2026"
  JWT_SECRET: "a3f9c2e7b1d4f6a8c0e2b4d6f8a0c2e4b6d8f0a2c4e6b8d0f2a4c6e8b0d2f4a6"
  DATABASE_URL_USERS: "postgresql://postgres:GlobeTrotter2026@postgres:5432/globetrotter_users"
  DATABASE_URL_DESTINATIONS: "postgresql://postgres:GlobeTrotter2026@postgres:5432/globetrotter_destinations"
  DATABASE_URL_ITINERARIES: "postgresql://postgres:GlobeTrotter2026@postgres:5432/globetrotter_itineraries"
