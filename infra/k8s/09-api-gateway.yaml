apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: globetrotter
spec:
  replicas: 2
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway }
    spec:
      containers:
        - name: api-gateway
          image: globetrotter/api-gateway:latest
          imagePullPolicy: Never
          ports: [{ containerPort: 3000 }]
          env:
            - { name: PORT, value: "3000" }
            - name: NODE_ENV
              valueFrom: { configMapKeyRef: { name: globetrotter-config, key: NODE_ENV } }
            - name: USERS_SERVICE_URL
              valueFrom: { configMapKeyRef: { name: globetrotter-config, key: USERS_SERVICE_URL } }
            - name: DESTINATIONS_SERVICE_URL
              valueFrom: { configMapKeyRef: { name: globetrotter-config, key: DESTINATIONS_SERVICE_URL } }
            - name: ITINERARIES_SERVICE_URL
              valueFrom: { configMapKeyRef: { name: globetrotter-config, key: ITINERARIES_SERVICE_URL } }
            - name: RECOMMENDATIONS_SERVICE_URL
              valueFrom: { configMapKeyRef: { name: globetrotter-config, key: RECOMMENDATIONS_SERVICE_URL } }
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "250m", memory: "256Mi" }
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 5
---
# type: NodePort so `minikube service api-gateway -n globetrotter --url` exposes a single,
# load-balanced entry point across all api-gateway replicas without any cloud LoadBalancer.
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: globetrotter
spec:
  type: NodePort
  selector: { app: api-gateway }
  ports: [{ port: 3000, targetPort: 3000 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  namespace: globetrotter
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 50 }
